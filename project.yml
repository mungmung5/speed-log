# XcodeGen 설정: GitHub Actions에서 이 파일로 Xcode 프로젝트를 만들어 빌드합니다.
name: SpeedLog
options:
  bundleIdPrefix: com.mungmung5
  developmentLanguage: ko
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SpeedLog:
    type: application
    platform: iOS
    sources:
      - path: SpeedLog
    settings:
      base:
        PRODUCT_NAME: SpeedLog
        PRODUCT_BUNDLE_IDENTIFIER: com.mungmung5.speedlog
        INFOPLIST_FILE: Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
schemes:
  SpeedLog:
    build:
      targets:
        SpeedLog: all
    run:
      config: Debug
    archive:
      config: Release
